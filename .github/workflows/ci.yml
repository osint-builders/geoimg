name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint (goimports, golines, go vet, go-critic)
        if: runner.os == 'Linux'
        env:
          GOTOOLCHAIN: auto # pinned linters need a newer Go than the module minimum
        run: make lint
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/geoimg
